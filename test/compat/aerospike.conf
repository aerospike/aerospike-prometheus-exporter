# Shared config for every server in the compatibility matrix.
#
# IMPORTANT: this must be valid on the OLDEST server in .env. Directives added
# by newer builds abort startup on older ones -- for example
# enable-benchmarks-wire-compression is 8.2-only and makes 8.1.2.3 exit with
# "unknown config parameter name".
#
# Namespaces deliberately cover memory, device, and secondary-index cases so
# the namespace, sets, sindex, latencies and xdr contexts all produce metrics.

service {
    proto-fd-max 15000
    cluster-name compat_cluster
    feature-key-file /etc/aerospike/features.conf
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

# A DC that never connects is enough to make the xdr context emit metrics.
xdr {
    dc backup_dc_1 {
        node-address-port 127.0.0.1 65530
        namespace test {
        }
        namespace bar {
        }
    }
}

namespace test {
    replication-factor 1
    enable-benchmarks-read true
    enable-benchmarks-write true
    enable-benchmarks-batch-sub true
    storage-engine memory {
        data-size 1G
    }
}

namespace bar {
    replication-factor 1
    enable-benchmarks-read true
    enable-benchmarks-write true
    enable-benchmarks-batch-sub true
    storage-engine device {
        file /opt/aerospike/data/bar.dat
        filesize 1G
    }
}
