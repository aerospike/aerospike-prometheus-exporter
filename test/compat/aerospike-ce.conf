# Community Edition variant of aerospike.conf, used when no Enterprise feature
# key is available (automatic fallback, or ./compat-test.sh --community).
#
# Differs from aerospike.conf in exactly two ways, both mandatory:
#
#   1. No feature-key-file. CE aborts with
#      "'feature-key-file' is enterprise-only".
#   2. No xdr stanza. XDR is an Enterprise feature.
#
# Consequence, measured: this loses the entire aerospike_xdr_* context, 40 of
# 643 metric families. XDR metrics do NOT appear just because the server
# supports them -- the exporter enumerates DCs via get-config:context=xdr, so
# with no DC configured it emits nothing. Verified on Enterprise too, so it is
# not a CE quirk.
#
# Keep this in sync with aerospike.conf. It must also stay valid on the OLDEST
# server in docker-compose.yml.

service {
    proto-fd-max 15000
    cluster-name compat_cluster
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 1
    enable-benchmarks-read true
    enable-benchmarks-write true
    enable-benchmarks-batch-sub true
    storage-engine memory {
        data-size 1G
    }
}

namespace bar {
    replication-factor 1
    enable-benchmarks-read true
    enable-benchmarks-write true
    enable-benchmarks-batch-sub true
    storage-engine device {
        file /opt/aerospike/data/bar.dat
        filesize 1G
    }
}
