name: Integrations server versions
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "0 3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scrape:
    name: ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 5.7.0.32
          - 6.4.0.34
          - 7.2.0.11
          - 8.0.0.20
          - 8.1.2.5
          - 8.2.0.0
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exporter scrape
        env:
          APE_IT_SERVER_VERSIONS: ${{ matrix.version }}
        run: make test-integration-versions
