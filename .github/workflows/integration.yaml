name: Integration
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - dev
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secret-agent:
    name: secret agent
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secret Agent integration
        run: make test-integration-secret-agent

  processor:
    name: processor info
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Processor info integration
        env:
          APE_IT_FEATURE_KEY: ${{ secrets.APE_IT_FEATURE_KEY }}
        run: |
          if [ -z "${APE_IT_FEATURE_KEY}" ]; then
            make test-integration-processor
            exit 0
          fi
          key="${RUNNER_TEMP}/features.conf"
          printf '%s\n' "${APE_IT_FEATURE_KEY}" > "${key}"
          APE_IT_FEATURE_KEY_FILE="${key}" make test-integration-processor

  users:
    name: user stats
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: User stats integration
        env:
          APE_IT_FEATURE_KEY: ${{ secrets.APE_IT_FEATURE_KEY }}
        run: |
          if [ -z "${APE_IT_FEATURE_KEY}" ]; then
            make test-integration-users
            exit 0
          fi
          key="${RUNNER_TEMP}/features.conf"
          printf '%s\n' "${APE_IT_FEATURE_KEY}" > "${key}"
          APE_IT_FEATURE_KEY_FILE="${key}" make test-integration-users

  server-72:
    name: server 7.2 scrape
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exporter scrape
        run: make test-integration-versions

  otel:
    name: otel collector
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kernel settings for the server's flash index
        run: sudo sysctl -w vm.dirty_bytes=16777216 vm.dirty_background_bytes=1 vm.dirty_expire_centisecs=1 vm.dirty_writeback_centisecs=10
      - name: OpenTelemetry collector integration
        run: make test-integration-otel

  prometheus:
    name: prometheus listener
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kernel settings for the server's flash index
        run: sudo sysctl -w vm.dirty_bytes=16777216 vm.dirty_background_bytes=1 vm.dirty_expire_centisecs=1 vm.dirty_writeback_centisecs=10
      - name: Prometheus listener integration
        run: make test-integration-prometheus

  docker:
    name: docker release image
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker image integration
        run: make test-integration-docker
