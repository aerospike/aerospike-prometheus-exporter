name: Promote release bundle to STAGE / PREVIEW

# Promotes an aerospike-prometheus-exporter release bundle from TEST to STAGE, or from STAGE to PREVIEW.
# Doing the same promotion in the JFrog UI is equivalent.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release bundle version, as printed by the "Release bundle" job of the release run (e.g. 1.37.0-12345678901-1)
        required: true
        type: string
      target-stage:
        description: STAGE (needs the version at TEST) or PREVIEW (needs it at STAGE)
        required: true
        type: choice
        options: [STAGE, PREVIEW]
        default: STAGE
      dry-run:
        description: Only print the JFrog commands, do not promote
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote to ${{ inputs.target-stage }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_promote-release-bundle.yaml@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
    with:
      # Must match the ref in the uses: line above.
      gh-workflows-ref: 308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
      jf-project: database
      jf-bundle-name: aerospike-prometheus-exporter
      version: ${{ inputs.version }}
      target-stage: ${{ inputs.target-stage }}
      dry-run: ${{ inputs.dry-run }}
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
