# Server fixture for the user-stats integration suite.
# Security is on. The default Enterprise admin user is admin / admin, which is
# what the asadm commands in the compose file log in as.
#
# Not started by make test. The integration run mounts an Enterprise feature key
# at /etc/aerospike/features.conf. That key is not committed.

service {
	proto-fd-max 15000
	enforce-best-practices false
	cluster-name ape-users-it

	feature-key-file /etc/aerospike/features.conf
}

logging {
	console {
		context any info
	}
}

security {
	enable-quotas true
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}
}

namespace test {
	replication-factor 1

	storage-engine memory {
		data-size 1G
	}
}
