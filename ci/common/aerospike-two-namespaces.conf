# Single-node Enterprise server with two namespaces, test and bar. Both have a flash index, so the server
# answers index-pressure for them. The Enterprise image brings its own evaluation feature key.
# The restart suites start with this file and then restart the server with aerospike-one-namespace.conf,
# which has no bar namespace, to check that the exporter stops reporting what the server no longer has.
service {
	cluster-name ape-it
	proto-fd-max 15000
	enforce-best-practices false
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace test {
	replication-factor 1

	storage-engine device {
		file /opt/aerospike/data/test.dat
		filesize 1G
	}

	# index-pressure is reported only for flash indexes
	index-type flash {
		mount /opt/aerospike/data/test_index
		mounts-budget 4G
	}
}

namespace bar {
	replication-factor 1

	storage-engine device {
		file /opt/aerospike/data/bar.dat
		filesize 1G
	}

	# index-pressure is reported only for flash indexes
	index-type flash {
		mount /opt/aerospike/data/bar_index
		mounts-budget 4G
	}
}
