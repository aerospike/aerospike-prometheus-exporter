# The server of the restart suites after the restart: the same as aerospike-two-namespaces.conf without bar.
service {
	cluster-name ape-it
	proto-fd-max 15000
	enforce-best-practices false
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace test {
	replication-factor 1

	storage-engine device {
		file /opt/aerospike/data/test.dat
		filesize 1G
	}

	# index-pressure is reported only for flash indexes
	index-type flash {
		mount /opt/aerospike/data/test_index
		mounts-budget 4G
	}
}
