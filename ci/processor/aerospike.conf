# Server fixture for the processor integration suite.
# One process, several namespaces. Each namespace is a different storage shape
# so the namespace and node info responses exercise a different processor path.
#
# Not started by make test. The integration run mounts an Enterprise feature key
# at /etc/aerospike/features.conf. That key is not committed.
#
# test2 and test3 from the checkpoint conf were the same shape as the flash
# namespace, so only one flash namespace is kept. The checkpoint and compression
# settings from that conf are on employees_flash.

service {
	proto-fd-max 15000
	enforce-best-practices false
	cluster-name ape-processor-it
	node-id BB9BA2DF19BCD8A

	# asd needs --preview index-checkpoint for this path. The compose file passes it.
	index-checkpoint-path /opt/aerospike/data/checkpoint
	enable-benchmarks-wire-compression true

	feature-key-file /etc/aerospike/features.conf
}

logging {
	console {
		context any info
	}
	file /var/log/aerospike/aerospike.log {
		context any info
	}
}

# security stays off. User statistics are covered by the ci/users suite, which
# enables security and creates its own users. This server stays unauthenticated
# so asinfo can be used as the healthcheck.

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}

	admin {
		address any
		port 3003
	}
}

# Memory only. No file, device, or flash index.
namespace test_only_mem {
	replication-factor 2

	storage-engine memory {
		data-size 2G
	}
}

# Memory engine persisted to a file.
# Read and write benchmarks are on at startup. Enabling them later lists the
# histogram names but does not record samples.
namespace test {
	replication-factor 2
	enable-benchmarks-read true
	enable-benchmarks-write true

	storage-engine memory {
		filesize 2G
		file /opt/aerospike/data/test.dat
	}
}

# Device file, indexes kept in memory.
namespace bar {
	replication-factor 2
	indexes-memory-budget 1G

	storage-engine device {
		file /opt/aerospike/data/bar.dat
		filesize 2G
	}
}

# Persistent memory.
namespace bar_pmem {
	replication-factor 2

	storage-engine pmem {
		file /opt/aerospike/data/bar_pmem.dat
		filesize 2G
	}
}

# Device file plus flash primary and secondary indexes.
# index-pressure is requested only after the processor sees index-type flash.
namespace employees_flash {
	replication-factor 2
	index-checkpoint-compression true
	index-checkpoint-threads 4
	replication-compression-mode delta-zstd
	replication-compression-level 1
	migrate-compression-mode zstd
	migrate-compression-level 1

	storage-engine device {
		file /opt/aerospike/data/emp_flash.dat
		filesize 2G
	}

	index-type flash {
		mount /opt/aerospike/data/emp_flash_index
		mounts-budget 4G
		evict-mounts-pct 10
	}

	sindex-type flash {
		mount /opt/aerospike/data/emp_flash_sindex
		mounts-budget 2G
	}
}

# Remote datacenters are not started with this server. The block is here so
# get-config:context=xdr returns dc names for the XDR processor.
xdr {
	dc backup {
		node-address-port 172.17.0.8 3000
		namespace test {
		}
	}

	dc asia_dr {
		node-address-port 172.17.0.7 3000
		namespace test {
		}
	}
}
