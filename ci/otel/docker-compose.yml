name: ape-otel

services:
  aerospike:
    # Enterprise, for the flash indexes behind index-pressure. The image brings its own evaluation feature key.
    image: aerospike/aerospike-server-enterprise:8.2.0.0
    user: "0:0"
    # proto-fd-max needs more open files than the 1024 that GitHub runners give a container by default
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    entrypoint: ["/bin/bash", "-c"]
    # The restart phase recreates the server with the config that has no bar namespace.
    command:
      - |
        set -euo pipefail
        mkdir -p /opt/aerospike/data/test_index /opt/aerospike/data/bar_index /var/run/aerospike
        exec asd --config-file /etc/ape-it/aerospike.conf --foreground
    volumes:
      - ../common/${APE_IT_AEROSPIKE_CONF:-aerospike-two-namespaces.conf}:/etc/ape-it/aerospike.conf:ro
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s

  # The exporter gRPC client uses TLS. This suite uses http_endpoint, which
  # sends OTLP over plain HTTP to the collector /v1/metrics path.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    user: "0:0"
    command: ["--config", "/etc/otel/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otel/collector.yaml:ro
      - otel-output:/output

  ape:
    image: golang:${CI_GO_VERSION:?set by make from go.mod}
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
    command: ["go", "run", "./cmd", "--config", "/etc/ape/ape.toml", "--gauge-list", "/src/configs/gauge_stats_list.toml"]
    volumes:
      - ../..:/src
      - ./ape.toml:/etc/ape/ape.toml:ro
      - logs:/logs
    depends_on:
      aerospike:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # The tester runs on the server image only for asinfo, which creates and drops a secondary index.
  tester:
    image: aerospike/aerospike-server:7.2.0.11
    volumes:
      - ./scripts/wait.sh:/scripts/wait.sh:ro
      - otel-output:/output:ro
      - logs:/logs:ro
    entrypoint: ["/bin/sh", "/scripts/wait.sh"]
    depends_on:
      ape:
        condition: service_started

volumes:
  otel-output:
  logs:
